services:
  - type: web
    name: zyvoqix-reborn
    runtime: static
    buildCommand: 'npm install --ignore-scripts --no-audit --no-fund && npm run build'
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

services:
  - type: web
    name: zyvoqix-reborn
    runtime: static
    buildCommand: 'test -f public/index.html'
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

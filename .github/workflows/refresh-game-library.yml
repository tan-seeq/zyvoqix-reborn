name: Repair runtime and expand licensed games
on:
  push:
    branches: [library/self-hosted-v8]
    paths: [scripts/rebuild-space-pirates.py, scripts/test-space-startup.cjs, scripts/package-more-games.py, vendor/more-games.json, vendor/beachy-lock.json, vendor/beachy-touch.js, .github/workflows/refresh-game-library.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: self-hosted-library
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library/self-hosted-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -m pip install Pillow==11.3.0
      - name: Repair exact bundled Space Pirates source and test startup regressions
        run: python3 scripts/rebuild-space-pirates.py
      - name: Package independent licensed additions
        run: python3 scripts/package-more-games.py
      - name: Verify twelve-game runtime and preserved site pages
        run: |
          npm run build
          node --check public/library.js
          node --check public/game-bridge.js
          node --check public/hub.js
          python3 scripts/verify-library.py
      - name: Save complete archives and pin release
        run: |
          git config user.name "ZYVOQIX Library Build"
          git config user.email "zyvoqix-library@users.noreply.github.com"
          git add vendor/*.tar.gz public/licenses/ public/covers/ public/library-catalog.json public/library-build.json
          git diff --cached --quiet || git commit -m "Repair Space Pirates and vendor four licensed games with corresponding source"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('library.lock.json');x=json.loads(p.read_text());x['archiveCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          git add library.lock.json
          git diff --cached --quiet || git commit -m "Pin repaired twelve-game runtime"
          git push origin HEAD:library/self-hosted-v8

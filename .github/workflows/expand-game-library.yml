name: Expand licensed game library
on:
  push:
    branches: [library/self-hosted-v8]
    paths: [scripts/expand-library.py, vendor/additional-games.json, vendor/additional-locks/**, .github/workflows/expand-game-library.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: self-hosted-library
  cancel-in-progress: false
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: library/self-hosted-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and package four pinned additions
        run: python3 scripts/expand-library.py
      - name: Verify complete library
        run: |
          npm run build
          node --check public/library.js
          node --check public/language.js
          node --check public/app.js
          python3 scripts/verify-library.py
      - name: Save licensed packages and pin archives
        run: |
          git config user.name "ZYVOQIX Library Build"
          git config user.email "zyvoqix-library@users.noreply.github.com"
          git add vendor/*.tar.gz public/licenses/ public/covers/ public/library-catalog.json public/library-build.json
          git diff --cached --quiet || git commit -m "Add parkour, voxel building, island survival and flight games"
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          p=Path('library.lock.json');x=json.loads(p.read_text());x['archiveCommit']=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();p.write_text(json.dumps(x,indent=2)+'\n')
          PY
          git add library.lock.json
          git diff --cached --quiet || git commit -m "Pin eight-game library release"
          git push origin HEAD:library/self-hosted-v8

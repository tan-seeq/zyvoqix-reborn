<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daylight phone layout review</title><style>
body{margin:0;padding:20px;background:#eaf1fc;color:#25324c;font:14px Arial,sans-serif}main{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}section{width:375px}h2{font-size:16px}iframe{display:block;width:375px;height:812px;border:1px solid #b8cce5;border-radius:18px;background:white}select{padding:8px;margin-bottom:12px;max-width:100%}
</style></head><body><h1>Phone layout review · 375 px</h1><p>Preview-only harness. Frames run real site pages at a narrow CSS viewport.</p><main>
<section><h2>Arabic library</h2><select aria-label="First phone page" data-frame="phone-ar"><option value="/ar/">Arabic library</option><option value="/ar/play/glimmer-box/">Arabic game</option><option value="/community.html">Comments</option></select><iframe id="phone-ar" title="Arabic phone" src="/ar/"></iframe></section>
<section><h2>English hub</h2><select aria-label="Second phone page" data-frame="phone-hub"><option value="/tiers.html">Tier lists</option><option value="/rankings.html">Rankings</option><option value="/community.html">Comments</option><option value="/missions.html">Missions</option><option value="/arcade/index.html#profile">Profile</option></select><iframe id="phone-hub" title="Hub phone" src="/tiers.html"></iframe></section>
<section><h2>Game page</h2><iframe id="phone-game" title="Game phone" src="/play/glimmer-box/"></iframe></section>
</main><script>for(const select of document.querySelectorAll('select'))select.addEventListener('change',()=>{document.getElementById(select.dataset.frame).src=select.value;});</script></body></html>

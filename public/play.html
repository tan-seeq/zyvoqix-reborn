<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اللعب | ZYVOQIX</title><link rel="icon" href="/icons/zyvoqix-icon-192.png"><style>body{font-family:system-ui,Arial;background:#070b19;color:white;margin:0}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#0f1c39;border-bottom:1px solid #2d5383;gap:12px}a{color:#7cdcff;text-decoration:none}button{background:#1b72d4;color:white;border:0;border-radius:8px;padding:9px 14px}main{height:calc(100dvh - 135px);max-width:1500px;margin:auto;background:radial-gradient(circle,#142c5b,#080b1c);display:grid;place-items:center}iframe{width:100%;height:100%;border:0;display:none}p{text-align:center;color:#aebfdc;font-size:12px;padding:5px 14px}</style></head><body><header><a href="/">← العودة إلى ZYVOQIX</a><b id="name">جار التحميل...</b><button id="full">ملء الشاشة ⛶</button></header><main id="box"><p id="message">جار تحضير اللعبة...</p><iframe id="game" allow="autoplay; fullscreen; gamepad; payment" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="لعبة مجتمع مفتوح المصدر"></iframe></main><p><span id="provider">الألعاب المضمنة تعمل من سيرفرات الناشر، وقد تسري عليها شروطه.</span> لو لم تعمل بالداخل <a id="out" target="_blank" rel="noopener noreferrer" href="/">افتحها عند صاحبها الأصلي ↗</a></p><script src="/telemetry.js?v=8.2" defer></script><script>
(async()=>{
try{
 const id=new URLSearchParams(location.search).get('id');
 const response=await fetch('/library.json?v=8.2',{cache:'no-store'});
 if(!response.ok)throw Error('Catalog not loaded');
 const catalog=await response.json();
 const g=(catalog.games||[]).find(x=>x.id===id&&x.mode==='embed');
 if(!g)throw Error('Game is unavailable');
 const u=new URL(g.url);
 const community=g.source==='community'&&u.origin==='https://sausi-7.github.io'&&u.pathname.startsWith('/games/games/');
 const partner=g.source==='playgama'&&u.origin==='https://playgama.com'&&/^\/export\/game\/[a-z0-9_-]+\/?$/i.test(u.pathname)&&u.searchParams.has('clid');
 if(!community&&!partner)throw Error('Publisher has not authorized this embed');
 document.getElementById('name').textContent=g.name;
 document.title=g.name+' | ZYVOQIX';
 document.getElementById('out').href=u.href;
 const frame=document.getElementById('game');frame.title=g.name;frame.src=u.href;frame.style.display='block';
 document.getElementById('message').remove();
 document.getElementById('provider').textContent=partner?'Playgama Partners: اللعبة تعمل من سيرفرات الناشر وقد تعرض إعلانات أو عمليات شراء':'لعبة مجتمع مفتوح المصدر، قد لا يدعم الناشر التضمين على كل المتصفحات';
 document.getElementById('full').onclick=()=>document.getElementById('box').requestFullscreen?.();
 window.addEventListener('load',()=>window.ZYVOQIX_METRICS?.track('embedded_game_open',{game_source:g.source,game_id:g.id}));
}catch(e){document.getElementById('message').textContent='اللعبة غير متاحة داخل الصفحة. ارجع للمكتبة واختر لعبة أخرى.';console.error(e)}
})();
</script></body></html>

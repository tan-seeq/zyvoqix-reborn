<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اللعب | ZYVOQIX</title><link rel="icon" href="/icons/zyvoqix-icon-192.png"><style>body{font-family:system-ui,Arial;background:#070b19;color:white;margin:0}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:12px 18px;background:#0f1c39;border-bottom:1px solid #2d5383;gap:12px}a{color:#7cdcff;text-decoration:none}button{background:#1b72d4;color:white;border:0;border-radius:8px;padding:9px 14px}main{height:calc(100dvh - 135px);max-width:1500px;margin:auto;background:radial-gradient(circle,#142c5b,#080b1c);display:grid;place-items:center}iframe{width:100%;height:100%;border:0;display:none}p{text-align:center;color:#aebfdc;font-size:12px;padding:5px 14px}</style></head><body><header><a href="/">← العودة إلى ZYVOQIX</a><b id="name">جار التحميل...</b><button id="full">ملء الشاشة ⛶</button></header><main id="box"><p id="message">جار تحضير اللعبة...</p><iframe id="game" allow="autoplay; fullscreen; gamepad" allowfullscreen title="لعبة مجتمع مفتوح المصدر"></iframe></main><p>لعبة مجتمعية من مشروع مفتوح المصدر بترخيص MIT. لو لم تعمل بالداخل <a id="out" target="_blank" rel="noopener noreferrer" href="/">افتحها عند صاحبها الأصلي ↗</a></p><script>(async()=>{try{const id=new URLSearchParams(location.search).get('id');const r=await fetch('/library.json?v=8.1');const a=(await r.json()).games;const g=a.find(x=>x.id===id&&x.mode==='embed'&&x.url.startsWith('https://sausi-7.github.io/games/games/'));if(!g)throw Error('Unavailable');document.getElementById('name').textContent=g.name;document.title=g.name+' | ZYVOQIX';document.getElementById('out').href=g.url;document.getElementById('game').src=g.url;document.getElementById('game').style.display='block';document.getElementById('message').remove();document.getElementById('full').onclick=()=>document.getElementById('box').requestFullscreen?.()}catch(e){document.getElementById('message').textContent='اللعبة غير متاحة داخل الصفحة. ارجع للمكتبة واختر لعبة أخرى.';console.error(e)}})()</script></body></html>
